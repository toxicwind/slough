name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install

      - name: typecheck
        run: bunx tsc --noEmit --allowImportingTsExtensions --module nodenext --moduleResolution nodenext --target esnext src/*.ts
        continue-on-error: true

      - name: unit tests
        run: bun test

      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./bin"
